<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, 'public', '', ~{::main})}">
<head><title>Eco Swape · 404</title></head>
<body>
<main id="main" class="container error-page">
    <span class="error-page__code" aria-hidden="true">404</span>
    <h1>We couldn't find that page</h1>
    <p>The page may have moved, or the listing is no longer available. Let's get you back to the exchange.</p>
    <div class="cluster">
        <a class="btn btn--primary" th:href="@{/}"><svg th:replace="~{fragments/ui :: icon('house', '')}"></svg>Back to home</a>
        <a class="btn btn--secondary" th:href="@{/explore}">Explore items</a>
    </div>
</main>
</body>
</html>
