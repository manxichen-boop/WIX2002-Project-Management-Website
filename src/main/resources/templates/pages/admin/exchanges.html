<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, 'admin', 'admin/exchanges', ~{::main})}">
<head><title>Exchanges · Eco Swape Admin</title></head>
<body>
<main id="main" class="app-main">
    <div class="page-head"><div><h1>Exchanges</h1><p>Monitor student-to-student exchanges. Individual requests don't need approval; step in through reports.</p></div></div>
    <div class="toolbar">
        <div class="input-wrap"><svg th:replace="~{fragments/ui :: icon('search', '')}"></svg><label class="sr-only" for="q">Search</label><input class="input" id="q" type="search" maxlength="80" placeholder="Search item or student"></div>
        <label class="sr-only" for="status">Status</label>
        <select class="select" id="status"><option value="">All statuses</option><option value="PENDING">Pending</option><option value="ACCEPTED">Accepted</option><option value="COMPLETED">Completed</option><option value="REJECTED">Declined</option><option value="CANCELLED">Cancelled</option><option value="CLOSED">Closed</option></select>
    </div>
    <div class="card"><div class="table-wrap" id="rows" aria-live="polite"></div></div><div id="pager"></div>
</main>
</body>
</html>
