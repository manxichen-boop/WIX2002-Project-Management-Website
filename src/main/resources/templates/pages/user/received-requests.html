<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, 'user', 'received-requests', ~{::main})}">
<head><title>Received requests · Eco Swape</title></head>
<body>
<main id="main" class="app-main">
    <div class="page-head"><div><h1>Received requests</h1><p>Students who want your items. Accepting reserves the item; you then arrange the handover.</p></div></div>
    <div class="tabs" role="tablist" style="margin-bottom:18px"><button class="tab" role="tab" type="button" data-status="PENDING" aria-selected="true">Waiting for you</button><button class="tab" role="tab" type="button" data-status="ACCEPTED" aria-selected="false">Accepted</button><button class="tab" role="tab" type="button" data-status="" aria-selected="false">All</button></div>
    <div class="request-list" id="rows" aria-live="polite"></div><div id="pager"></div>
</main>
</body>
</html>
