<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, 'user', 'dashboard', ~{::main})}">
<head><title>Dashboard · Eco Swape</title></head>
<body>
<main id="main" class="app-main">
    <section class="welcome" aria-labelledby="welcome-title">
        <div>
            <h1 id="welcome-title" th:text="'Welcome back, ' + ${currentUser.firstName()}">Welcome back</h1>
            <p th:text="${currentUser.university} + ' · here is what is happening with your exchanges.'">University</p>
        </div>
        <div class="welcome__actions">
            <a class="btn btn--lime" th:href="@{/items/new}"><svg th:replace="~{fragments/ui :: icon('plus', '')}"></svg>Post an item</a>
            <a class="btn btn--secondary" th:href="@{/explore}"><svg th:replace="~{fragments/ui :: icon('search', '')}"></svg>Explore items</a>
        </div>
    </section>

    <div class="stat-grid" id="stats" style="margin-top:22px" aria-live="polite" aria-busy="true"></div>

    <div class="dash-grid">
        <section class="card" aria-labelledby="awaiting-title">
            <div class="card__head"><h2 id="awaiting-title">Requests waiting for your answer</h2>
                <a class="link text-sm" th:href="@{/my/received-requests}">View all</a></div>
            <div class="card__body"><div class="request-list" id="awaiting"></div></div>
        </section>
        <section class="card" aria-labelledby="recent-title">
            <div class="card__head"><h2 id="recent-title">Recent notifications</h2>
                <a class="link text-sm" th:href="@{/notifications}">View all</a></div>
            <div id="recent"></div>
        </section>
    </div>
</main>
</body>
</html>
