<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, 'public', 'forgot-password', ~{::main})}">
<head><title>Forgot password · Eco Swape</title></head>
<body>
<main id="main" class="container auth">
    <section class="card auth__card" aria-labelledby="forgot-title">
        <h1 id="forgot-title">Forgot your password?</h1>
        <p>Enter your university e-mail and we'll send you a link to choose a new one.</p>
        <div class="alert alert--success" data-success hidden role="status" style="margin-top:20px"></div>
        <form class="form" id="forgot-form" novalidate>
            <div class="alert alert--danger" data-form-error hidden role="alert"></div>
            <div class="field">
                <label for="email">University e-mail</label>
                <input class="input" id="email" name="email" type="email" autocomplete="email" maxlength="190" required autofocus>
            </div>
            <button class="btn btn--primary btn--block" type="submit">Send reset link</button>
        </form>
        <p class="auth__switch"><a class="link" th:href="@{/login}">Back to log in</a></p>
    </section>
        <div class="auth__art" aria-hidden="true">
            <img th:src="@{/img/hero-scene.webp}" alt="">
            <p class="auth__quote">Reuse today,<br>for a greener tomorrow</p>
        </div>
</main>
</body>
</html>
