<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, 'public', 'reset-password', ~{::main})}">
<head><title>Choose a new password · Eco Swape</title></head>
<body>
<main id="main" class="container auth">
    <section class="card auth__card" aria-labelledby="reset-title">
        <h1 id="reset-title">Choose a new password</h1>
        <p>Use at least 8 characters with a letter and a number.</p>
        <div class="alert alert--danger" th:if="${token == null or token.isBlank()}" style="margin-top:18px">
            <svg th:replace="~{fragments/ui :: icon('circle-alert', '')}"></svg>
            <div><strong>Reset link missing</strong>Open the link from your e-mail again, or <a class="link" th:href="@{/forgot-password}">request a new one</a>.</div>
        </div>
        <form class="form" id="reset-form" novalidate th:unless="${token == null or token.isBlank()}">
            <div class="alert alert--danger" data-form-error hidden role="alert"></div>
            <input type="hidden" name="token" th:value="${token}">
            <div class="field">
                <label for="password">New password</label>
                <div class="input-wrap">
                    <svg th:replace="~{fragments/ui :: icon('lock', '')}"></svg>
                    <input class="input" id="password" name="password" type="password" autocomplete="new-password" maxlength="72" required autofocus>
                    <button class="input-wrap__toggle" type="button" aria-label="Show password" data-toggle-password="password"><svg th:replace="~{fragments/ui :: icon('eye', '')}"></svg></button>
                </div>
            </div>
            <div class="field">
                <label for="confirmPassword">Confirm new password</label>
                <input class="input" id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" maxlength="72" required>
            </div>
            <button class="btn btn--primary btn--block" type="submit">Save new password</button>
        </form>
    </section>
        <div class="auth__art" aria-hidden="true">
            <img th:src="@{/img/hero-scene.webp}" alt="">
            <p class="auth__quote">Reuse today,<br>for a greener tomorrow</p>
        </div>
</main>
</body>
</html>
