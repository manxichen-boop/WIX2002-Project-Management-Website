<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="75%"><stop offset="0" stop-color="#fffcf2"/><stop offset="1" stop-color="#f8f1df"/></radialGradient>
    <radialGradient id="disc" cx="50%" cy="38%" r="60%"><stop offset="0" stop-color="#e6f2c4"/><stop offset=".75" stop-color="#cfe6a0"/><stop offset="1" stop-color="#c3df8c" stop-opacity=".9"/></radialGradient>
    <linearGradient id="arrow" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8ccf3c"/><stop offset="1" stop-color="#5aa628"/></linearGradient>
    <linearGradient id="arrowFade" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5aa628"/><stop offset="1" stop-color="#8ccf3c" stop-opacity=".1"/></linearGradient>
    <linearGradient id="boxFront" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e2bb84"/><stop offset="1" stop-color="#c9985a"/></linearGradient>
    <linearGradient id="boxSide" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#c08b4f"/><stop offset="1" stop-color="#a97842"/></linearGradient>
    <linearGradient id="flap" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#efcf9d"/><stop offset="1" stop-color="#dbb178"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#dfeee9" stop-opacity=".85"/><stop offset=".3" stop-color="#ffffff" stop-opacity=".7"/><stop offset=".7" stop-color="#e3f0ec" stop-opacity=".55"/><stop offset="1" stop-color="#bfd7cf" stop-opacity=".9"/></linearGradient>
    <linearGradient id="lid" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e7c793"/><stop offset="1" stop-color="#c79c5f"/></linearGradient>
    <linearGradient id="roll" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9cc865"/><stop offset="1" stop-color="#5f9433"/></linearGradient>
    <radialGradient id="rollEnd" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#b6d98a"/><stop offset="1" stop-color="#6d9e3e"/></radialGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8fcc4a"/><stop offset="1" stop-color="#4f9a2c"/></linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>
  <g transform="translate(-46 -50) scale(1.18)">
  <circle cx="256" cy="246" r="168" fill="url(#disc)"/>

  <!-- circular arrows -->
  <path d="M96 236 A 162 162 0 0 1 300 92" fill="none" stroke="url(#arrow)" stroke-width="15" stroke-linecap="round"/>
  <path d="M286 64 L 334 98 L 282 122 Z" fill="#7cc236" stroke="#7cc236" stroke-width="6" stroke-linejoin="round"/>


  <!-- leaves -->
  <g fill="url(#leaf)">
    <path d="M80 330 C 74 296 96 274 126 270 C 128 304 108 326 80 330 Z"/>
    <path d="M70 372 C 78 348 104 340 128 352 C 114 374 92 382 70 372 Z"/>
    
  </g>
  <path d="M80 330 L 112 284 M70 372 L 116 356" stroke="#f3f8e6" stroke-width="2" opacity=".7"/>

  <!-- shadow -->
  <ellipse cx="262" cy="398" rx="150" ry="14" fill="#6a5a34" opacity=".22" filter="url(#soft)"/>

  <!-- cardboard box -->
  <path d="M138 236 H 268 V 392 H 138 Z" fill="url(#boxFront)"/>
  <path d="M268 236 L 312 214 V 368 L 268 392 Z" fill="url(#boxSide)"/>
  <path d="M138 236 L 182 214 H 312 L 268 236 Z" fill="#9d6f3b"/>
  <path d="M138 236 H 268 L 248 198 H 120 Z" fill="url(#flap)"/>
  <path d="M268 236 L 312 214 L 330 180 L 286 202 Z" fill="#cf9f61"/>
  <path d="M182 214 H 312 L 294 186 H 198 Z" fill="#b98647"/>
  <rect x="190" y="236" width="26" height="40" fill="#d8b47e" opacity=".8"/>
  <!-- recycle symbol -->
  <g transform="translate(203 330) scale(1.15)" fill="none" stroke="#4f8a2a" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-8 -22 L 4 -22 L 14 -6"/><path d="M8 -12 L 14 -6 L 5 -4"/>
    <path d="M18 6 L 12 17 L -6 17"/><path d="M1 23 L -6 17 L 1 10"/>
    <path d="M-20 8 L -26 -3 L -17 -18"/><path d="M-27 -10 L -17 -18 L -12 -10"/>
  </g>

  <!-- glass jar -->
  <path d="M300 262 Q298 252 310 248 H 380 Q392 252 390 262 V 384 Q390 398 374 398 H 316 Q300 398 300 384 Z" fill="#f2f7f1" opacity=".6"/>
  <path d="M304 318 Q 326 304 346 316 T 386 312 V 384 Q 386 394 372 394 H 318 Q 304 394 304 384 Z" fill="#8cbc55"/>
  <path d="M304 344 Q 328 332 348 346 T 386 340 V 384 Q 386 394 372 394 H 318 Q 304 394 304 384 Z" fill="#efe4c8"/>
  <path d="M304 368 Q 326 360 344 370 T 386 366 V 384 Q 386 394 372 394 H 318 Q 304 394 304 384 Z" fill="#d1a467"/>
  <path d="M300 262 Q298 252 310 248 H 380 Q392 252 390 262 V 384 Q390 398 374 398 H 316 Q300 398 300 384 Z" fill="url(#glass)" stroke="#b9d0c8" stroke-width="2"/>
  <rect x="312" y="272" width="8" height="96" rx="4" fill="#fff" opacity=".7"/>
  <rect x="302" y="224" width="86" height="28" rx="8" fill="url(#lid)"/>
  <path d="M308 232 h 74 M308 241 h 74" stroke="#a97c45" stroke-width="1.5" opacity=".5"/>

  <!-- fabric roll -->
  <path d="M186 368 H 296 A 18 22 0 0 1 296 412 H 186 Z" fill="url(#roll)"/>
  <path d="M212 368 v 44 M226 368 v 44" stroke="#f3f7e8" stroke-width="5" opacity=".85"/>
  <ellipse cx="186" cy="390" rx="18" ry="22" fill="url(#rollEnd)"/>
  <ellipse cx="186" cy="390" rx="10" ry="13" fill="none" stroke="#557f2f" stroke-width="2"/>
  <ellipse cx="186" cy="390" rx="4" ry="5" fill="#4c7429"/>
  <path d="M262 368 v 44" stroke="#e0c08e" stroke-width="4"/>
  <path d="M262 370 c 10 -10 18 -6 14 4 M262 370 c -10 -10 -18 -6 -14 4" fill="none" stroke="#e0c08e" stroke-width="3"/>
  <path d="M430 238 A 178 178 0 0 1 352 420" fill="none" stroke="url(#arrowFade)" stroke-width="14" stroke-linecap="round"/>
  <path d="M366 400 L 322 442 L 378 446 Z" fill="#6fb52f" stroke="#6fb52f" stroke-width="6" stroke-linejoin="round"/>
</g>
</svg>
